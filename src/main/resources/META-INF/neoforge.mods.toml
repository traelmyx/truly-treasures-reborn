modLoader = "javafml"
loaderVersion = "[1,)"
license = "LGPL-3.0"
issueTrackerURL = "https://github.com/traelmyx/truly-treasures-reborn/issues"

[[mods]]
modId = "${id}"
version = "${version}"
displayName = "${name}"
authors = "traelmyx, Ineffa"
${logo_key} = "assets/trulytreasures/icon.png"
displayTest = "IGNORE_SERVER_VERSION"
description = '''Treasure enchantments like Mending come from wandering traders instead of villagers. Based on Truly Treasures by Ineffa.'''

[[mixins]]
config = "trulytreasures.mixins.json"

[[dependencies.${id}]]
modId = "neoforge"
type = "required"
versionRange = "[${neoforge_major},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${id}]]
modId = "minecraft"
type = "required"
versionRange = "${mc_dep}"
ordering = "NONE"
side = "BOTH"
